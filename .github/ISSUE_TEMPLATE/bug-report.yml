name: Bug report
description: Report a reproducible problem with the application.
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, private notes or exported library files in a public issue.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the exact error or a description of the visual problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and version
      placeholder: Firefox 142 on macOS 15, or Chrome on Pixel 8
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Dark
        - Light
        - Both
        - Not applicable
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots are welcome. Remove personal notes or quote-library contents first.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues for the same problem.
          required: true
        - label: This report contains no secrets or private library data.
          required: true
